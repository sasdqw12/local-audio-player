name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# contents: write 用于把编译好的 APK 发布到 Release（提供永久直链）
permissions:
  contents: write

jobs:
  build-apk:
    # 固定 22.04：24.04 移除了 libtinfo5 / 默认 Python 3.12，会导致 buildozer 构建失败
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 关键：Android Gradle Plugin 强制要求 Java 17。
      # ubuntu-22.04 runner 默认 JAVA_HOME 指向 Java 11（temurin-11），
      # 仅 apt 安装 openjdk-17 不会改变 JAVA_HOME，
      # 会在最后 gradlew assembleDebug 阶段报
      # "Android Gradle plugin requires Java 17 to run. You are currently using Java 11."
      # 用 setup-java 正确接管 JAVA_HOME 与 PATH。
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: Install system dependencies
        run: |
          sudo apt-get -qq -o=Dpkg::Use-Pty=0 update
          sudo apt-get -qq -o=Dpkg::Use-Pty=0 install -y \
            build-essential git zip unzip ccache \
            autoconf automake libtool pkg-config cmake \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            libssl-dev libsqlite3-dev libffi-dev libbz2-dev libltdl-dev

      - name: Install build dependencies (pinned toolchain)
        run: |
          python -m pip install -q --upgrade pip setuptools wheel
          pip install -q \
            Cython==0.29.37 \
            buildozer==1.5.0 \
            python-for-android==2024.01.21 \
            "sh==1.14.3" \
            virtualenv
          pip install -q kivy==2.3.0 kivymd==1.2.0 plyer pyjnius certifi
          echo "--- 已安装版本 ---"
          pip show buildozer python-for-android 2>/dev/null | grep -E "^(Name|Version)"

      - name: Show effective p4a branch
        run: |
          echo "buildozer.spec 里的 p4a.branch："
          grep -E "^\s*p4a\.branch" buildozer.spec || echo "  !! 未设置 —— buildozer 会回落到 master（会拉 Python 3.14，构建必失败）"

      - name: Build APK with buildozer
        run: |
          set -o pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          buildozer android debug 2>&1 | tee build_full.log
        env:
          ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
          ANDROIDNDK: /home/runner/.buildozer/android/platform/android-ndk-r25b
          ANDROIDAPI: 33
          ANDROIDMINAPI: 21

      - name: Show build result
        run: ls -lh bin/ || true

      # 失败时只提取关键片段，避免下载十几 MB 的完整日志
      - name: Extract error excerpt
        if: failure()
        run: |
          {
            echo "########## JAVA / 环境 ##########"
            echo "JAVA_HOME=$JAVA_HOME"
            java -version 2>&1 || true
            echo
            echo "########## 实际使用的 p4a ##########"
            P4A=.buildozer/android/platform/python-for-android
            git -C "$P4A" describe --tags 2>/dev/null || true
            grep -nE "^\s*version\s*=" "$P4A/pythonforandroid/recipes/python3/__init__.py" 2>/dev/null | head -3 || true
            echo
            echo "########## 关键错误 ##########"
            grep -nE "What went wrong|FAILURE:|Execution failed for task|Could not find a version|A problem occurred|Caused by|^error:|Command failed|Buildozer failed" build_full.log 2>/dev/null | tail -100 || true
            echo
            echo "########## 最后 300 行 ##########"
            tail -300 build_full.log 2>/dev/null || true
          } > build_error.txt
          echo "build_error.txt 大小: $(wc -c < build_error.txt) 字节"

      - name: Upload error excerpt
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error
          path: build_error.txt
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-audio-player-apk
          path: bin/*.apk
          retention-days: 30

      # 放在 artifact 上传之后：即使发布 Release 失败，也能保住已构建的 APK
      - name: Publish APK to Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" bin/*.apk \
            --title "APK 构建 $TAG" \
            --notes "自动构建的 Android 安装包。下载下面的 .apk 文件传到手机安装即可。" \
            --repo "${{ github.repository }}"
